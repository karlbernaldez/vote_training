[project]
name = "vote-training"
version = "0.1.0"
description = "Forecasting pipelines for atmospheric and ocean domains"
requires-python = ">=3.10"

dependencies = [
  "requests",
  "python-dotenv",
  "google-cloud-storage",
  "boto3",
  "numpy",
  "pandas",
  "scipy",
  "xarray",
  "cfgrib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
