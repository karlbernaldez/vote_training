name: Python tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - ingest
  pull_request:
    branches:
      - main
      - master
      - develop
      - ingest

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Scripts/Homework/4/requirements.txt

      - name: Run tests
        working-directory: Scripts/Homework/4
        run: pytest -q